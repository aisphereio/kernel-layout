version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
  # The scaffold intentionally returns the resource message directly from CRUD
  # RPCs to keep generated business handlers simple. We keep that convention
  # explicit instead of forcing wrapper responses solely to satisfy a style rule.
  except:
    - ENUM_VALUE_PREFIX
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
  - buf.build/bufbuild/protovalidate
breaking:
  use:
    - FILE
