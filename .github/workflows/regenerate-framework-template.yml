name: regenerate-framework-template

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix-framework-template'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout template branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Checkout Kernel hardening branch
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/kernel"
          git clone --depth 1 --branch fix-framework-boundary https://github.com/aisphereio/kernel.git "$RUNNER_TEMP/kernel"

      - name: Regenerate committed API artifacts
        shell: bash
        run: |
          set -euxo pipefail
          go mod edit -replace github.com/aisphereio/kernel="$RUNNER_TEMP/kernel"
          go mod tidy
          make tools-local KERNEL_LOCAL="$RUNNER_TEMP/kernel"
          make api KERNEL_LOCAL="$RUNNER_TEMP/kernel"
          make proto-check KERNEL_LOCAL="$RUNNER_TEMP/kernel"
          go mod edit -dropreplace github.com/aisphereio/kernel
          go mod tidy
          go test ./...

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api go.mod go.sum
          if git diff --cached --quiet; then
            echo 'generated artifacts already current'
            exit 0
          fi
          git commit -m 'generate: refresh template API artifacts'
          git push origin HEAD:${{ github.head_ref }}
